# docker compose up --build      -> API on :8000, UI on :8501
services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
  ui:
    build: .
    command: ["streamlit", "run", "front.py", "--server.port=8501", "--server.address=0.0.0.0"]
    # the UI gets only the public values; the service-role key stays in the api container
    environment:
      API_BASE: http://api:8000
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports: ["8501:8501"]
    depends_on:
      api:
        condition: service_healthy
